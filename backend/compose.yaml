services:
  db:
    image: mysql:8.0
    container_name: aaccup_pams_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aaccup_pams
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aaccup_pams_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
