vich_uploader:
    db_driver: orm
    mappings:
        evidence_files:
            uri_prefix: /api/evidence
            upload_destination: '%kernel.project_dir%/var/uploads/evidence'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
